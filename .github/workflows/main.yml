name: Build Exynos Kernel

on:
  workflow_dispatch:
    inputs:
      GITHUB_BRANCH:
        description: 'Branch of github repo to clone'
        required: true
        default: '-b main'

      GITHUB_REPO:
        description: 'Github repo to clone'
        required: true
        default: 'https://github.com/redmax19/android_kernel_samsung_a14x'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 1️⃣ Checkout code
        uses: actions/checkout@v7

      - name: 2️⃣ Cloning kernel source
        run: |
          git clone \
            ${{ github.event.inputs.GITHUB_BRANCH }} \
            ${{ github.event.inputs.GITHUB_REPO }} \
            kernel_source

      - name: 3️⃣ Cloning Samsung toolchain
        run: |
          cd kernel_source

          git clone \
            --depth 1 \
            --single-branch \
            -b clang-r450784d_linux-x86 \
            https://github.com/SN-Abdullah-Al-Noman/samsung-toolchain \
            toolchain

      - name: 4️⃣ Compiling kernel
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          cd kernel_source

          touch logs.txt

          bash build_kernel.sh |& tee logs.txt

      - name: 5️⃣ Get kernel Image
        run: |
          BOOT_DIR="kernel_source/out/arch/arm64/boot"

          echo "Kernel output:"
          ls -lah "$BOOT_DIR" || true

          if [ ! -f "$BOOT_DIR/Image" ]; then
            echo "ERROR: Image não foi gerada."

            echo "Procurando outputs:"
            find kernel_source/out/arch/arm64/boot \
              -type f \
              \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" \) \
              -print || true

            exit 1
          fi

          mkdir -p artifacts
          cp "$BOOT_DIR/Image" artifacts/Image

          ls -lh artifacts/Image

      - name: 6️⃣ Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-A14-Kernel-Image
          path: artifacts/Image
          if-no-files-found: error

      - name: 7️⃣ Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-Log
          path: kernel_source/logs.txt
          if-no-files-found: ignore
