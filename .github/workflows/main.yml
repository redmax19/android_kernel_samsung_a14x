name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: toolchain
      run: git clone https://github.com/SN-Abdullah-Al-Noman/samsung-toolchain toolchain

    - name: AnyKernel3
      run: git clone https://github.com/osm0sis/AnyKernel3

    - name: ksu
      run: curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

    - name: Build
      run: bash build_kernel.sh

    - name: Build AnyKernel package
      run: |
        cp out/arch/arm64/boot/Image AnyKernel3/Image
        cat << 'EOF' > AnyKernel3/anykernel.sh
        ### AnyKernel3 Ramdisk Mod Script
        ## osm0sis @ xda-developers

        ### AnyKernel setup
        # global properties
        properties() { '
        kernel.string=alessandro a14x Kernel
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=a14x
        device.name2=
        device.name3=
        device.name4=
        device.name5=
        supported.versions=
        supported.patchlevels=
        supported.vendorpatchlevels=
        '; } # end properties

        ### AnyKernel install
        # boot shell variables
        block=/dev/block/by-name/boot;
        is_slot_device=0;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;

        # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
        . tools/ak3-core.sh;

        # boot install
        dump_boot; # use split_boot to skip ramdisk unpack, e.g. for devices with init_boot ramdisk

        write_boot; # use flash_boot to skip ramdisk repack, e.g. for devices with init_boot ramdisk
        ## end boot install
        EOF

        cd AnyKernel3
        zip -r9 "../alessandro a14x Kernel.zip" * -x .git .github README.md *placeholder

    - name: Upload AnyKernel package
      uses: actions/upload-artifact@v7
      with:
        name: AnyKernel package
        path: alessandro a14x Kernel.zip
